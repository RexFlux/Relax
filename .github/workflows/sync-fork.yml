name: Sync fork with upstream

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fork-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'RexFlux/Relax'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync main from the parent repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/${GH_REPO}/merge-upstream" -f branch=main
